    <rect x="174" y="150" width="40" height="212" rx="20"/>
    <rect x="236" y="106" width="40" height="300" rx="20"/>
    <rect x="298" y="168" width="40" height="176" rx="20"/>
    <rect x="360" y="212" width="40" height="88" rx="20"/>
