<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Evo Song Manager · Downloads</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-title" content="Evo Songs">
</head>
<body>
<!-- LACI: lagu baru + folder per vokalis -->
<aside class="drawer" id="drawer" aria-label="Folders" aria-hidden="true">
  <div class="side-head">
    <div class="brand side-brand">Evo Song Manager<small>Downloads</small></div>
    <button id="drawerClose" class="icon-btn" aria-label="Close menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/><path d="M20 6l-6 6 6 6" opacity=".45"/></svg>
    </button>
  </div>
  <nav class="side-nav" id="drawerNav"></nav>
</aside>
<div class="side-backdrop" id="drawerBackdrop"></div>

<div class="wrap">
  <header class="top vtop">
    <button id="drawerBtn" class="icon-btn menu-open hidden" aria-label="Open folders" aria-controls="drawer" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <div class="brand">Evo Song Manager</div>
    <img class="logo" src="/logo.svg" alt="" width="34" height="34">
  </header>
  <h1 id="title">New songs</h1>
  <p class="sub" id="sub">Loading…</p>

  <div id="app" class="hidden">
    <div class="op-bar">
      <span class="op-count" id="newCount"></span>
      <button class="primary op-all" id="allBtn" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
        <span>Download all new</span>
      </button>
    </div>
    <div class="table" id="list"></div>
    <p class="note op-note">Songs appear here after the vocalist presses <b>Send to FC</b>. Once you download a song it moves into that vocalist's folder in the menu, where you can download it again.</p>
  </div>

  <div id="msg" class="empty-card hidden"><h2 id="msgTitle"></h2><p id="msgSub"></p></div>
</div>
<script type="module" src="/js/apps/operator/main.js"></script>
</body>
</html>
