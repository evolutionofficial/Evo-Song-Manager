<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar Lagu · First Club</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">First Club<small>Daftar semua backing track</small></div>
    <a class="btn" href="/admin">Admin</a>
  </header>

  <h1>Semua lagu</h1>
  <p class="sub" id="sub">Memuat…</p>

  <div class="bar">
    <div class="grow"><input type="search" id="q" placeholder="Cari judul atau nama vokalis" aria-label="Cari lagu"></div>
    <select id="status" class="hidden" aria-label="Filter status" style="width:auto">
      <option value="">Semua status</option>
      <option value="unpaid">Belum lunas</option>
      <option value="paid">Lunas</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>

  <div class="table" id="table"><div class="empty">Memuat…</div></div>
  <footer>First Club · data diperbarui otomatis dari folder Mixdown</footer>
</div>

<script type="module" src="/js/apps/public/main.js"></script>
</body>
</html>
