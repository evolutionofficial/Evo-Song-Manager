<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song List · First Club</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">First Club<small>All backing tracks</small></div>
    <a class="btn" href="/admin">Admin</a>
  </header>

  <h1>All songs</h1>
  <p class="sub" id="sub">Loading…</p>

  <div class="bar">
    <div class="grow"><input type="search" id="q" placeholder="Search title or vocalist" aria-label="Search songs"></div>
    <select id="status" class="hidden" aria-label="Filter status" style="width:auto">
      <option value="">All statuses</option>
      <option value="unpaid">Unpaid</option>
      <option value="paid">Paid</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>

  <div class="table" id="table"><div class="empty">Loading…</div></div>
  <footer>First Club · updated automatically from the Mixdown folders</footer>
</div>

<script type="module" src="/js/apps/public/main.js"></script>
</body>
</html>
